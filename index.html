<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放送委員リクエストリスト</title>
    <style>
        /* CSS部分は元のコードと全く同じなので省略（そのまま貼り付けてください） */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background-color: #f5f5f5; }
        .container { background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { font-size: 24px; margin-bottom: 20px; color: #333; }
        .auth-box { margin-bottom: 20px; padding: 15px; background: #eef2f3; border-radius: 6px; display: flex; gap: 10px; align-items: center; }
        input[type="password"], input[type="text"] { padding: 8px 40px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
        button { padding: 8px 16px; border: none; background-color: #00bfff; color: white; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background-color: #00b5df; }
        .edit-area { display: none; margin-bottom: 20px; gap: 10px; }
        .edit-mode .edit-area { display: flex; }
        .edit-mode .auth-box { display: none; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: #fff; transition: opacity 0.2s; }
        .item-left { display: flex; align-items: center; gap: 12px; flex-grow: 1; }
        .item-text { font-size: 16px; color: #333; }
        li.checked-item .item-text { text-decoration: line-through; color: #888; }
        li.checked-item { background-color: #fafafa; }
        input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; }
        input[type="checkbox"]:disabled { cursor: not-allowed; }
        .delete-btn { display: none; background-color: #dc3545; padding: 4px 8px; font-size: 12px; margin-left: 10px; }
        .delete-btn:hover { background-color: #bd2130; }
        .edit-mode .delete-btn { display: inline-block; }
        .status-msg { font-size: 14px; color: #28a745; font-weight: bold; margin-bottom: 15px; display: none; }
        .edit-mode .status-msg { display: block; }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    <h1>放送委員会 リクエスト曲共有リスト</h1>
    <div class="status-msg">編集モード有効（リストの追加・削除が可能です）</div>

    <div class="auth-box">
        <input type="password" id="passwordInput" placeholder="管理用パスワードを入力">
        <button onclick="checkPassword()">リストを編集する</button>
    </div>

    <div class="edit-area">
        <input type="text" id="newItemInput" placeholder="新しいアイテムを追加" style="flex-grow: 1;">
        <button onclick="addItem()" style="background-color: #28a745;">追加</button>
    </div>

    <ul id="itemList"></ul>
</div>

<script>
    const CORRECT_PASSWORD = "London21"; //
    let items = [];

    // サーバーからデータを読み込む関数
    async function loadItems() {
        const response = await fetch('/api/items');
        items = await response.json();
        renderList();
    }

    function renderList() {
        const listElement = document.getElementById('itemList');
        listElement.innerHTML = '';
        
        items.forEach((item) => {
            const li = document.createElement('li');
            if (item.checked) {
                li.classList.add('checked-item');
            }

            // MongoDBの自動ID（_id）を使用
            const checkboxHtml = `
                <input type="checkbox" 
                       ${item.checked ? 'checked disabled' : ''} 
                       onchange="lockCheck('${item._id}')">
            `;

            li.innerHTML = `
                <div class="item-left">
                    ${checkboxHtml}
                    <span class="item-text">${escapeHtml(item.text)}</span>
                </div>
                <button class="delete-btn" onclick="removeItem('${item._id}')">削除</button>
            `;
            listElement.appendChild(li);
        });
    }

    // チェックロック（サーバーへ保存）
    async function lockCheck(id) {
        await fetch(`/api/items/${id}`, { method: 'PUT' });
        loadItems(); // 再読み込み
    }

    function checkPassword() {
        const input = document.getElementById('passwordInput').value;
        if (input === CORRECT_PASSWORD) {
            document.getElementById('mainContainer').classList.add('edit-mode');
        } else {
            alert('パスワードが違います。');
        }
    }

    // アイテムの追加（サーバーへ保存）
    async function addItem() {
        const inputElement = document.getElementById('newItemInput');
        const text = inputElement.value.trim();
        
        if (text !== '') {
            await fetch('/api/items', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            inputElement.value = '';
            loadItems();
        }
    }

    // アイテムの削除（サーバーから削除）
    async function removeItem(id) {
        if (confirm('このアイテムを削除しますか？')) {
            await fetch(`/api/items/${id}`, { method: 'DELETE' });
            loadItems();
        }
    }

    function escapeHtml(str) {
        return str.replace(/[&<>"']/g, function(match) {
            const escape = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
            return escape[match];
        });
    }

    // 初回読み込み
    loadItems();
</script>
</body>
</html>
